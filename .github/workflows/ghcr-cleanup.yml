name: GHCR Cleanup

on:
  schedule:
    # Weekly GHCR package cleanup
    - cron: "30 3 * * 0"
    # Monthly GitHub Releases cleanup
    - cron: "30 4 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions only"
        required: false
        type: boolean
        default: true
      keep_release_tags:
        description: "How many newest year-based release tags to keep"
        required: false
        type: number
        default: 6
      keep_github_releases:
        description: "How many newest year-based GitHub Releases to keep"
        required: false
        type: number
        default: 6
      delete_release_tags:
        description: "Also delete matching git tags when deleting GitHub Releases"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve package endpoint
        id: endpoint
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          PACKAGE_LC="$(echo "${PACKAGE}" | tr '[:upper:]' '[:lower:]')"
          USER_ENDPOINT="/users/${OWNER}/packages/container/${PACKAGE_LC}/versions"
          ORG_ENDPOINT="/orgs/${OWNER}/packages/container/${PACKAGE_LC}/versions"

          if gh api "${USER_ENDPOINT}?per_page=1" >/dev/null 2>&1; then
            echo "endpoint=${USER_ENDPOINT}" >> "$GITHUB_OUTPUT"
          else
            echo "endpoint=${ORG_ENDPOINT}" >> "$GITHUB_OUTPUT"
          fi
          echo "package=${PACKAGE_LC}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Delete old package versions
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
          OWNER: ${{ steps.endpoint.outputs.owner }}
          PACKAGE_LC: ${{ steps.endpoint.outputs.package }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_release_tags || '6' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          versions_json="$(gh api --paginate "${ENDPOINT}?per_page=100")"

          if [ "$(echo "${versions_json}" | jq 'length')" -eq 0 ]; then
            echo "No package versions found."
            exit 0
          fi

          # Build candidate list with normalized tags AND digest (name field).
          # The digest is required to protect multi-arch child manifests below.
          normalized="$(echo "${versions_json}" | jq '
            sort_by(.created_at) | reverse
            | map({
                id: .id,
                digest: .name,
                created_at: .created_at,
                tags: (.metadata.container.tags // [])
              })
          ')"

          # Keep latest-tagged versions and the newest N year-based release tags.
          keep_latest_ids="$(echo "${normalized}" | jq -r '
            [ .[] | select(.tags | index("latest")) | .id ] | unique | .[]
          ' || true)"

          keep_release_ids="$(echo "${normalized}" | jq -r --argjson keep "${KEEP_RELEASES}" '
            [ .[]
              | select(
                  (.tags | map(test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]+$")) | any)
                )
            ][0:$keep]
            | map(.id)
            | unique
            | .[]
          ' || true)"

          keep_ids="$(printf "%s\n%s\n" "${keep_latest_ids}" "${keep_release_ids}" | awk 'NF' | sort -u)"

          # --- Protect multi-arch children of every tag we are keeping ---
          #
          # GHCR stores each platform-specific manifest (amd64, arm64, ...) of a
          # multi-arch image as its own, UNTAGGED package version. Only the
          # top-level manifest index carries the tag. Deleting "all untagged
          # versions" therefore deletes the live children of tags we intend to
          # keep, leaving the tag itself pointing at a manifest that 404s on
          # pull ("manifest unknown") even though the tag and index look fine.
          #
          # Resolve each kept tag's index and collect the digests of its
          # children so we never delete them, tagged or not.

          keep_digests="$(echo "${normalized}" | jq -r --argjson ids "$(printf '%s\n' "${keep_ids}" | awk 'NF' | jq -R . | jq -s 'map(tonumber)')" '
            [ .[] | select(.id as $id | $ids | index($id)) | .digest ] | .[]
          ')"

          protected_digests_file="$(mktemp)"
          printf "%s\n" "${keep_digests}" > "${protected_digests_file}"

          reg_token="$(curl -s "https://ghcr.io/token?scope=repository:${OWNER}/${PACKAGE_LC}:pull" | jq -r .token)"

          while IFS= read -r digest; do
            [ -n "${digest}" ] || continue
            children="$(curl -s \
              -H "Authorization: Bearer ${reg_token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${OWNER}/${PACKAGE_LC}/manifests/${digest}" \
              | jq -r '.manifests[]?.digest // empty' || true)"
            if [ -n "${children}" ]; then
              printf "%s\n" "${children}" >> "${protected_digests_file}"
            fi
          done < "${protected_digests_file}"

          protected_ids="$(echo "${normalized}" | jq -r --slurpfile digests <(sort -u "${protected_digests_file}" | jq -R . | jq -s .) '
            . as $all
            | ($digests[0]) as $prot
            | [ $all[] | select(.digest as $d | $prot | index($d)) | .id ] | unique | .[]
          ' || true)"

          rm -f "${protected_digests_file}"

          # Delete:
          # - untagged versions (EXCEPT protected multi-arch children, see above)
          # - versions tagged with main-*
          # - old release-tagged versions beyond keep window
          delete_ids="$(echo "${normalized}" | jq -r '
            .[]
            | . as $v
            | ($v.tags | length) as $tag_count
            | ($v.tags | map(test("^main-")) | any) as $is_main_sha
            | ($v.tags | map(test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]+$")) | any) as $is_release
            | if ($tag_count == 0) or $is_main_sha or $is_release then $v.id else empty end
          ' | sort -u)"

          # Filter out keep list AND protected multi-arch children.
          exclude_ids="$(printf "%s\n%s\n" "${keep_ids}" "${protected_ids}" | awk 'NF' | sort -u)"
          final_delete_ids="$(comm -23 <(printf "%s\n" "${delete_ids}" | awk 'NF' | sort -u) <(printf "%s\n" "${exclude_ids}") || true)"

          if [ -z "${final_delete_ids}" ]; then
            echo "No versions to delete after retention filtering."
            exit 0
          fi

          echo "Will delete version IDs:"
          printf "%s\n" "${final_delete_ids}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run enabled. No deletions performed."
            exit 0
          fi

          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            gh api -X DELETE "${ENDPOINT}/${id}"
            echo "Deleted package version ${id}"
          done <<< "${final_delete_ids}"

      - name: Delete old GitHub releases
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 1 * *'
        env:
          REPO: ${{ github.repository }}
          KEEP_GH_RELEASES: ${{ github.event.inputs.keep_github_releases || '6' }}
          DELETE_TAGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delete_release_tags || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          releases_json="$(gh api --paginate "repos/${REPO}/releases?per_page=100")"

          if [ "$(echo "${releases_json}" | jq 'length')" -eq 0 ]; then
            echo "No GitHub releases found."
            exit 0
          fi

          # Keep the newest N year-based releases (vYYYY.MM.patch).
          keep_release_ids="$(echo "${releases_json}" | jq -r --argjson keep "${KEEP_GH_RELEASES}" '
            map(select(.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]+$")))
            | sort_by(.published_at // .created_at // "1970-01-01T00:00:00Z")
            | reverse
            | .[0:$keep]
            | map(.id)
            | unique
            | .[]
          ' || true)"

          # Candidate releases to delete: older year-based releases not in keep window.
          delete_release_lines="$(echo "${releases_json}" | jq -r '
            map(select(.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]+$")))
            | sort_by(.published_at // .created_at // "1970-01-01T00:00:00Z")
            | reverse
            | .[]
            | "\(.id)\t\(.tag_name)"
          ')"

          if [ -z "${delete_release_lines}" ]; then
            echo "No year-based GitHub releases found to evaluate."
            exit 0
          fi

          keep_release_ids_sorted="$(printf "%s\n" "${keep_release_ids}" | awk 'NF' | sort -u)"
          delete_release_ids="$(printf "%s\n" "${delete_release_lines}" | cut -f1 | awk 'NF' | sort -u)"
          final_delete_release_ids="$(comm -23 <(printf "%s\n" "${delete_release_ids}") <(printf "%s\n" "${keep_release_ids_sorted}") || true)"

          if [ -z "${final_delete_release_ids}" ]; then
            echo "No GitHub releases to delete after retention filtering."
            exit 0
          fi

          echo "Will delete GitHub Releases (id -> tag):"
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            tag="$(printf "%s\n" "${delete_release_lines}" | awk -F '\t' -v rid="${id}" '$1 == rid { print $2; exit }')"
            echo "${id} -> ${tag}"
          done <<< "${final_delete_release_ids}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run enabled. No GitHub Releases deleted."
            exit 0
          fi

          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            tag="$(printf "%s\n" "${delete_release_lines}" | awk -F '\t' -v rid="${id}" '$1 == rid { print $2; exit }')"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
            echo "Deleted GitHub Release ${id} (${tag})"

            if [ "${DELETE_TAGS}" = "true" ] && [ -n "${tag}" ]; then
              gh api -X DELETE "repos/${REPO}/git/refs/tags/${tag}" || true
              echo "Deleted tag ${tag}"
            fi
          done <<< "${final_delete_release_ids}"
