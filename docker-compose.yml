x-weathernode-env: &weathernode-env
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8080"
  # Replace with your real app key before first start.
  # Laravel requires a base64 key that decodes to exactly 32 bytes.
  # Generate one:
  #   echo "base64:$(openssl rand -base64 32)"
  # Verify decoded byte length (must be 32):
  #   php -r '$k="base64:..."; echo strlen(base64_decode(substr($k,7), true)).PHP_EOL;'
  # Optional online decode/length check:
  #   https://www.base64decode.org/
  APP_KEY: "base64:REPLACE_WITH_YOUR_GENERATED_KEY"
  # SQLite by default (stored in the db_data volume).
  # The volume is mounted outside the app directory on purpose: mounting it over
  # /var/www/html/database would also cover database/migrations, and Docker only
  # seeds a named volume from the image the first time it is created. Every later
  # image pull would then run new code against the migrations the volume was
  # created with.
  DB_CONNECTION: "sqlite"
  DB_DATABASE: "/var/lib/weathernode/database.sqlite"
  SESSION_SECURE_COOKIE: "false"
  # Laravel defaults CACHE_STORE to `database`. That is a reasonable default for
  # shared hosting, but a poor one for a container that already has a persistent
  # storage volume: every cache write becomes a row write, and on MySQL with
  # durable commits that is an fsync per write.
  CACHE_STORE: "file"
  CONTAINERIZED: "true"
  DOCKER_AUTO_MIGRATE: "true"
  DOCKER_AUTO_SEED: "true"
  # The scheduler service below runs the scheduled tasks. Set this to "true" to
  # run them inside the app container instead, then remove the scheduler
  # service. Leaving both on is safe (each task still runs once), just wasteful.
  DOCKER_RUN_SCHEDULER: "false"
  # Optional first-run admin bootstrap (Docker only).
  # Option A: set ADMIN_* below to auto-create the first admin on initial startup.
  # Option B: leave ADMIN_EMAIL/ADMIN_PASSWORD empty and create the first admin in-browser at /setup/admin.
  # Security note: /setup/admin is only available while no users/admins exist.
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
  ADMIN_NAME: "Administrator"

services:
  app:
    image: ghcr.io/centauri/weathernode:latest
    pull_policy: always
    container_name: weathernode-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment: *weathernode-env
    volumes:
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
      - db_data:/var/lib/weathernode
    # Optional: use MySQL instead of SQLite — uncomment below and set DB_* in .env
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    # environment:
    #   DB_HOST: mysql

  scheduler:
    image: ghcr.io/centauri/weathernode:latest
    pull_policy: always
    container_name: weathernode-scheduler
    restart: unless-stopped
    # Must match the user php-fpm runs as in the app container. Both share the
    # storage volume, and with a file-backed cache a root-owned cache directory
    # makes every page 500 with "Failed to open stream: No such file or
    # directory", which reads as a missing path rather than a permissions
    # problem. This container overrides the entrypoint, so it never runs the
    # ownership fixups that would otherwise paper over it.
    user: "www-data"
    environment: *weathernode-env
    depends_on:
      app:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
      - db_data:/var/lib/weathernode
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
    # Optional: when using MySQL
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  # Uncomment for MySQL instead of SQLite
  # mysql:
  #   image: mysql:8.0
  #   container_name: weathernode-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: weathernode
  #     MYSQL_USER: weathernode
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

volumes:
  storage_data:
  cache_data:
  db_data:
  # mysql_data:
